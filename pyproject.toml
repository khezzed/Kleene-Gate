[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kleene-gate"
version = "0.1.0"
description = "KleeneGate: 3-Valued Kleene Boolean and Threshold Predicate Circuit Intelligent Contract on GenLayer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "genlayer-py",
    "genvm-linter",
    "genlayer-test",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/direct"]
pythonpath = [".", "contracts"]
addopts = "-v"
